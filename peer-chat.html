<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peer Chat - MindEase</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 80px); /* Adjust based on nav height */
      max-width: 800px;
      margin: 0 auto;
      background: var(--surface-color);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    
    .chat-header {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background: var(--surface-color);
    }
    
    .chat-header h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text-primary);
      margin-left: 1rem;
      flex-grow: 1;
    }
    
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }
    
    .back-link:hover {
      color: var(--primary-color);
    }
    
    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .status-active { background: #dcfce7; color: #166534; }
    .status-suspended { background: #fef08a; color: #854d0e; }
    .status-closed { background: #f3f4f6; color: #374151; }
    
    /* Crisis banner reused from peer-connect.html */
    .crisis-banner {
      background: #fef2f2;
      border-left: 4px solid #ef4444;
      padding: 1rem 1.5rem;
      margin: 1rem 1.5rem;
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
    }
    .crisis-banner h3 { color: #991b1b; margin-top: 0; }
    .crisis-banner ul { margin: 0.5rem 0 0 1.5rem; color: #b91c1c; }
    
    .chat-messages {
      flex-grow: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      background: var(--background-color);
      scroll-behavior: smooth;
    }
    
    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      margin-bottom: 0.5rem;
    }
    
    .message-wrapper.sent {
      align-self: flex-end;
      align-items: flex-end;
    }
    
    .message-wrapper.received {
      align-self: flex-start;
      align-items: flex-end; /* Align avatar to bottom of bubble */
      flex-direction: row;
      max-width: 85%;
    }
    
    .peer-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--text-secondary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
      margin-right: 8px;
      margin-bottom: 2px; /* Slight lift to match bubble visual */
    }

    .message-content-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .message-wrapper.sent .message-content-col {
      align-items: flex-end;
    }
    
    .message-bubble {
      padding: 0.75rem 1rem;
      border-radius: 20px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    
    .message-wrapper.sent .message-bubble {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      color: white;
      border-bottom-right-radius: 4px;
    }
    
    .message-wrapper.received .message-bubble {
      background: var(--surface-color);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }
    
    .message-meta {
      font-size: 0.7rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.2s ease, max-height 0.2s ease, margin-top 0.2s ease;
    }
    
    .message-wrapper:hover .message-meta {
      opacity: 1;
      max-height: 20px;
      margin-top: 0.25rem;
    }
    
    .message-wrapper.sent .message-bubble.sending {
      opacity: 0.7;
    }
    
    .message-wrapper.sent .message-bubble.failed {
      background: #ef4444;
    }
    
    .inline-crisis-nudge {
      font-size: 0.8rem;
      color: #ef4444;
      background: #fef2f2;
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      margin-top: 0.25rem;
      border: 1px solid #fca5a5;
    }
    
    .chat-input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background: var(--surface-color);
      display: flex;
      gap: 1rem;
      align-items: flex-end;
    }
    
    .chat-input-area textarea {
      flex-grow: 1;
      resize: none;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 0.75rem 1.25rem;
      font-family: inherit;
      font-size: 0.95rem;
      max-height: 120px;
      overflow-y: auto;
      background: var(--background-color);
    }
    
    .chat-input-area textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    
    .send-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn:disabled { background: var(--text-secondary); cursor: not-allowed; }
    
    .chat-disabled-banner {
      background: #f3f4f6;
      color: #4b5563;
      padding: 0.75rem;
      text-align: center;
      font-size: 0.9rem;
      border-top: 1px solid var(--border-color);
    }
    
    /* Full-page error states */
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      text-align: center;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="dashboard.html">
        <i class="fa-solid fa-leaf"></i> MindEase
      </a>
    </div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="journal.html">Journal</a>
      <a href="peer-connect.html" class="active">Peer Connect</a>
    </div>
    <div class="nav-user">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">
        <i class="fa-solid fa-moon"></i>
      </button>
      <div class="user-menu">
        <div class="user-avatar" id="userInitials">U</div>
        <div class="dropdown-content">
          <div class="dropdown-header">
            <span id="dropdownName">Anonymous User</span>
          </div>
          <a href="#" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Error Container (Hidden by default) -->
  <main class="container" id="errorView" style="display: none;">
    <div class="error-container">
      <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: var(--text-secondary); margin-bottom: 1rem;"></i>
      <h2 id="errorTitle">Conversation Not Found</h2>
      <p id="errorMsg" style="color: var(--text-secondary); margin-bottom: 2rem;">The conversation may have been closed or you don't have access to it.</p>
      <a href="peer-connect.html" class="btn btn-primary">Back to Peer Connect</a>
    </div>
  </main>

  <!-- Main Chat Container -->
  <main class="container" id="chatView" style="display: none; padding-top: 1rem;">
    <div class="chat-container">
      
      <div class="chat-header">
        <a href="peer-connect.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <h2 id="chatPeerName">Loading...</h2>
        <span id="chatStatusBadge" class="status-badge status-active">Active</span>
      </div>
      
      <div id="crisisGuidanceContainer"></div>
      <div id="peerNoticeContainer"></div>
      
      <div class="chat-messages" id="chatMessages">
        <!-- Messages will be injected here -->
      </div>
      
      <div id="chatDisabledBanner" class="chat-disabled-banner" style="display: none;">
        This conversation has ended and can no longer receive messages.
      </div>
      
      <div class="chat-input-area" id="chatInputArea">
        <textarea id="messageInput" placeholder="Type your message..." rows="1" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
        <button id="sendButton" class="send-btn" aria-label="Send message">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
      
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/peer-common.js"></script>
  <script src="js/peer-chat.js"></script>
</body>
</html>
