<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peer Chat - MindEase</title>
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .chat-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      max-width: 850px;
      margin: 0 auto;
      background: var(--surface-1);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }
    
    /* Header Bar (Instagram DM Style) */
    .chat-header {
      display: flex;
      align-items: center;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface-1);
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 0.75rem;
    }
    
    .back-link {
      color: var(--text-2);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    
    .back-link:hover {
      color: var(--text-1);
      background: var(--bg);
    }

    .chat-header-user {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-grow: 1;
    }
    
    .chat-peer-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--indigo);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    
    .chat-header-info {
      display: flex;
      flex-direction: column;
    }
    
    .chat-peer-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-1);
      line-height: 1.2;
    }
    
    .chat-status-text {
      font-size: 0.75rem;
      color: var(--text-2);
      line-height: 1.2;
      margin-top: 2px;
    }
    .chat-status-text.status-active { color: #16a34a; }
    .chat-status-text.status-suspended { color: #d97706; }
    .chat-status-text.status-closed { color: var(--text-2); }
    
    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.875rem;
      font-weight: 500;
      display: none; /* hidden, superseded by status-text in header info */
    }
    
    /* Banners (Crisis & Peer Notice) - Pinned near top, distinct & non-dismissible */
    .crisis-banner {
      background: #fef2f2;
      border-left: 4px solid #ef4444;
      padding: 1rem 1.25rem;
      margin: 0.75rem 1.25rem 0.25rem 1.25rem;
      border-radius: 8px;
      color: #991b1b;
      font-size: 0.9rem;
    }
    .crisis-banner h3 { color: #991b1b; margin: 0 0 0.4rem 0; font-size: 1rem; }
    .crisis-banner p { margin: 0 0 0.5rem 0; line-height: 1.4; }
    .crisis-banner ul { margin: 0.4rem 0 0 1.25rem; padding: 0; color: #b91c1c; }
    
    /* Message Thread Area */
    .chat-messages {
      flex-grow: 1;
      padding: 1.25rem 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    /* Date Separators */
    .chat-date-separator {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 1.25rem 0 0.5rem 0;
    }
    
    .chat-date-separator span {
      font-size: 0.725rem;
      color: var(--text-2);
      background: var(--surface-1);
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
    }
    
    /* Message Wrappers & Grouping */
    .message-wrapper {
      display: flex;
      max-width: 75%;
      margin-top: 12px; /* Generous spacing between message groups */
      position: relative;
    }
    
    .message-wrapper.consecutive {
      margin-top: 3px; /* Close gap for same-sender messages */
    }
    
    .message-wrapper.sent {
      align-self: flex-end;
      justify-content: flex-end;
    }
    
    .message-wrapper.received {
      align-self: flex-start;
      justify-content: flex-start;
      max-width: 80%;
    }
    
    /* Peer Avatar - shown ONLY on the last message in a consecutive group */
    .peer-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--indigo);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      flex-shrink: 0;
      margin-right: 8px;
      align-self: flex-end;
      visibility: hidden; /* Hidden by default for consecutive group messages */
      margin-bottom: 2px;
    }
    
    .message-wrapper.received.last-in-group .peer-avatar {
      visibility: visible; /* Revealed on last message in group */
    }

    .message-content-col {
      display: flex;
      flex-direction: column;
    }

    .message-wrapper.sent .message-content-col {
      align-items: flex-end;
    }
    
    .message-wrapper.received .message-content-col {
      align-items: flex-start;
    }
    
    .message-bubble {
      padding: 0.65rem 1rem;
      font-size: 0.925rem;
      line-height: 1.45;
      word-wrap: break-word;
      max-width: 100%;
    }
    
    /* Sent Bubbles - Instagram / Modern style rounded corners */
    .message-wrapper.sent .message-bubble {
      background: linear-gradient(135deg, var(--indigo), var(--violet));
      color: white;
      border-radius: 18px 18px 4px 18px;
    }
    
    /* Corner rounding for sent message groups */
    .message-wrapper.sent.group-start:not(.last-in-group) .message-bubble {
      border-radius: 18px 18px 4px 18px;
    }
    .message-wrapper.sent.middle-in-group .message-bubble {
      border-radius: 18px 4px 4px 18px;
    }
    .message-wrapper.sent.last-in-group.consecutive .message-bubble {
      border-radius: 18px 4px 18px 18px;
    }
    
    /* Received Bubbles */
    .message-wrapper.received .message-bubble {
      background: var(--surface-1);
      color: var(--text-1);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
    }
    
    /* Corner rounding for received message groups */
    .message-wrapper.received.group-start:not(.last-in-group) .message-bubble {
      border-radius: 18px 18px 18px 4px;
    }
    .message-wrapper.received.middle-in-group .message-bubble {
      border-radius: 4px 18px 18px 4px;
    }
    .message-wrapper.received.last-in-group.consecutive .message-bubble {
      border-radius: 4px 18px 18px 18px;
    }
    
    /* Timestamps - shown subtly below the last message in a group */
    .message-meta {
      font-size: 0.7rem;
      color: var(--text-2);
      display: none;
      align-items: center;
      gap: 0.35rem;
      margin-top: 3px;
      padding: 0 4px;
    }
    
    .message-wrapper.last-in-group .message-meta {
      display: flex;
    }
    
    .message-wrapper.sent .message-bubble.sending {
      opacity: 0.7;
    }
    
    .message-wrapper.sent .message-bubble.failed {
      background: #ef4444;
      color: white;
    }
    
    .inline-crisis-nudge {
      font-size: 0.8rem;
      color: #ef4444;
      background: #fef2f2;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      margin-top: 0.35rem;
      border: 1px solid #fca5a5;
    }
    
    /* Input Bar (Sticky Bottom) */
    .chat-input-area {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface-1);
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    
    .chat-input-area textarea {
      flex-grow: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 0.75rem 1.25rem;
      font-family: inherit;
      font-size: 0.95rem;
      max-height: 120px;
      line-height: 1.45;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text-1);
      transition: border-color 0.2s;
    }
    
    .chat-input-area textarea:focus {
      outline: none;
      border-color: var(--indigo);
    }
    
    .send-btn {
      background: var(--indigo);
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    
    .send-btn:hover {
      background: var(--violet);
      transform: scale(1.05);
    }
    .send-btn:disabled {
      background: var(--text-2);
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .chat-disabled-banner {
      background: #f3f4f6;
      color: #4b5563;
      padding: 0.75rem;
      text-align: center;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
    }
    
    /* Full-page error states */
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      text-align: center;
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .chat-container {
        height: calc(100vh - 70px);
        border-radius: 0;
        border: none;
      }
      .message-wrapper {
        max-width: 85%;
      }
      .chat-messages {
        padding: 1rem;
      }
      .chat-input-area {
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body class="dashboard-body">

  <div class="aurora" aria-hidden="true"></div>
  <div class="aurora-secondary" aria-hidden="true"></div>

  <div class="dashboard-container">
    <header class="dashboard-header">
      <div class="logo-mark" onclick="window.location.href='index.html'" style="cursor:pointer">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">MindEase</span>
      </div>
      <div class="header-actions">
        <button id="themeToggle" class="theme-btn" aria-label="Toggle theme">🌙</button>
        <button class="history-toggle-btn" onclick="window.location.href='peer-connect.html'" title="Back to Peer Connect">
          <span>🤝</span>
          <span class="history-btn-label">Peer Connect</span>
        </button>
        <div class="user-menu-wrapper" id="userMenuWrapper">
          <button class="user-avatar-btn" id="userAvatarBtn" onclick="toggleUserMenu()" aria-label="User menu">
            <span class="user-avatar-initials" id="userInitials">?</span>
          </button>
          <div class="user-dropdown hidden" id="userDropdown">
            <div class="dropdown-header">
              <div class="dropdown-name" id="dropdownName">Anonymous User</div>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item text-danger" onclick="logout()">
              <span class="dropdown-icon">🚪</span>
              Sign Out
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Error Container (Hidden by default) -->
    <main class="container" id="errorView" style="display: none;">
      <div class="error-container">
        <i class="fa-solid fa-circle-exclamation" style="font-size: 3rem; color: var(--text-2); margin-bottom: 1rem;"></i>
        <h2 id="errorTitle">Conversation Not Found</h2>
        <p id="errorMsg" style="color: var(--text-2); margin-bottom: 2rem;">The conversation may have been closed or you don't have access to it.</p>
        <a href="peer-connect.html" class="btn btn-primary">Back to Peer Connect</a>
      </div>
    </main>

    <!-- Main Chat Container -->
    <main class="container" id="chatView" style="display: none; padding-top: 0; padding-bottom: 1rem;">
      <div class="chat-container">
        
        <div class="chat-header">
          <a href="peer-connect.html" class="back-link" aria-label="Back to Peer Connect"><i class="fa-solid fa-arrow-left"></i></a>
          <div class="chat-header-user">
            <div class="chat-peer-avatar" id="chatPeerAvatar">P</div>
            <div class="chat-header-info">
              <div class="chat-peer-name" id="chatPeerName">Loading...</div>
              <div class="chat-status-text" id="chatStatusText">Active</div>
            </div>
          </div>
          <span id="chatStatusBadge" class="status-badge status-active" style="display: none;">Active</span>
        </div>
        
        <div id="crisisGuidanceContainer"></div>
        <div id="peerNoticeContainer"></div>
        
        <div class="chat-messages" id="chatMessages">
          <!-- Messages will be injected here -->
        </div>
        
        <div id="chatDisabledBanner" class="chat-disabled-banner" style="display: none;">
          This conversation has ended and can no longer receive messages.
        </div>
        
        <div class="chat-input-area" id="chatInputArea">
          <textarea id="messageInput" placeholder="Type your message..." rows="1" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
          <button id="sendButton" class="send-btn" aria-label="Send message">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
        
      </div>
    </main>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/peer-common.js"></script>
  <script src="js/peer-chat.js"></script>
</body>
</html>
